<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Web App Manifest：iOS PWA 啟動畫面 / 背景色 / standalone 模式 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover 讓 iOS Safari 把背景色塗到狀態列 + Home Indicator 安全區外（劉海 + 底部黑條） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Corphia AI Platform - 企業級私有部署 AI 問答系統，支援 RAG 與本地可信資料庫" />
    <meta name="keywords" content="Corphia, AI, Chat, RAG, 企業級 AI, 私有部署, ChatGPT" />
    <meta name="author" content="Corphia AI Team" />
    
    <!-- Security Headers (Meta fallback) -->
    <!--
      media-src 'self' blob:  ← 語音訊息播放需要 blob: URL
        前端用 MediaRecorder 錄音 → URL.createObjectURL() 產生 blob:http://localhost:5173/...
        若 CSP 沒明確列 media-src，會 fallback 到 default-src 'self' 把 blob: 全擋掉，
        音訊根本播不出來（log: violates Content Security Policy directive: "default-src 'self'"）
    -->
    <!--
      地端系統：頁面只能連「自己這台伺服器」，瀏覽器層級就擋掉任何對外連線（字型、圖片、資料傳送都一樣）。
        style-src / font-src  字型已經打包在程式裡（@fontsource/noto-sans-tc），不從外部載入
        img-src               只有本機圖片（同一台伺服器、data:、blob:）；回答裡的外部圖片本來就不顯示，這裡是最後一道
        connect-src           只有同一台伺服器的 API 與即時連線（ws: / wss: 保留給舊版瀏覽器的同站即時連線）
      之後若真的需要連某個外部服務，請在這裡「只加那一個網址」，不要整類開放。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:;" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <!-- Open Graph (Facebook/LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Corphia AI - 企業級私有部署解決方案" />
    <meta property="og:description" content="專為企業打造的本地 AI 問答系統，支援 RAG 技術與文件分析。" />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta property="og:url" content="https://corphia.ai/" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Corphia AI - 企業知識大腦" />
    <meta name="twitter:description" content="專為企業打造的本地 AI 問答系統，支援 RAG 技術與文件分析。" />
    <meta name="twitter:image" content="/apple-touch-icon.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://corphia.ai/" />
    
    <title>Corphia AI - Enterprise LLM Platform</title>
    <!--
      Theme-color：使用兩組 prefers-color-scheme 媒體查詢作為靜態 fallback；
      下方 boot script 會依使用者偏好 + 當前路徑動態覆寫單一 meta theme-color，
      確保 Safari 工具列顏色第一次繪製就正確。
      值與 frontend/src/index.css 的 --bg-base / --bg-surface 同步。
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181A" />
    <meta id="color-scheme-meta" name="color-scheme" content="light dark" />
    <!-- PWA 全螢幕能力標記
         apple-mobile-web-app-capable 是舊版（已 deprecated），但仍要保留供舊 iOS Safari 用；
         mobile-web-app-capable 是新標準，現代 Chromium 用這個 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      PWA 模式（加到主畫面）才生效，Safari 瀏覽器模式無作用：
        - black-translucent：狀態列透明，背景延伸到瀏海區，時間/電量浮在 page bg 上 —— 最像原生 App
        - default：標準白底黑字（在深色 page bg 上會出現一條白條）
        - black：純黑底
      Corphia 主色是 #202022 深色，所以 black-translucent 最適合，整片往上延伸視覺一致
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Boot script — 必須在任何 React/Vite 代碼執行前跑：
      1. 讀 localStorage 拿出使用者主題偏好（fallback prefers-color-scheme）
      2. 依當前路徑挑色：'/' 或 '/chat*' 用 surface 色，其他用 base 色
      3. 寫入 html.style.backgroundColor、colorScheme，並覆寫 meta[theme-color] 為單一動態值
      這樣 Safari 第一次繪製就能拿到正確背景色，不會閃黑。
    -->
    <script>
      (function() {
        try {
          // 同步 design-system/tokens.js
          var DARK_BASE = '#18181A'; // 同深色頁面底色（App.tsx 黑色漸層最上方 24,24,26），重整不閃色
          var DARK_SURFACE = '#28282A';
          var LIGHT_BASE = '#F6F4F0';
          var LIGHT_SURFACE = '#F2EFEA';

          // 預設跟系統，若使用者在設定明確選了 light/dark 就覆寫
          var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var stored = localStorage.getItem('ui-storage');
          if (stored) {
            var state = (JSON.parse(stored) || {}).state || {};
            var pref = state.themePreference || state.theme; // 後者是舊版相容
            if (pref === 'light' || pref === 'dark') theme = pref;
          }

          // 所有頁面統一用 base 色 + 弧線 SVG（chat 不再例外）
          var bg;
          if (theme === 'dark') {
            bg = DARK_BASE;
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'only dark';
          } else {
            bg = LIGHT_BASE;
            document.documentElement.style.colorScheme = 'only light';
          }
          document.documentElement.style.backgroundColor = bg;
          // body 也設一次，避免 Safari URL bar 透明區掉色
          if (document.body) document.body.style.backgroundColor = bg;

          // 移除靜態 prefers-color-scheme 的兩組 meta，改成單一動態值（覆寫 Safari）
          var staticMetas = document.querySelectorAll('meta[name="theme-color"]');
          staticMetas.forEach(function(m) { m.parentNode.removeChild(m); });
          var meta = document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          meta.setAttribute('content', bg);
          document.head.appendChild(meta);

          var csMeta = document.getElementById('color-scheme-meta');
          if (csMeta) csMeta.setAttribute('content', theme === 'dark' ? 'only dark' : 'only light');
        } catch(e) {}
      })();
    </script>
    <!-- 字型（思源黑體）打包在程式裡（src/main.tsx 的 @fontsource/noto-sans-tc），圖示用 components/snow/icons；不從外部網站載入任何東西 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
