name: Corphia CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    
    # 使用 PostgreSQL 服務做為測試資料庫
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: corphia
          POSTGRES_PASSWORD: corphia123
          POSTGRES_DB: corphia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint Backend (Ruff)
      working-directory: ./backend
      run: |
        python -m ruff check --select E,F --ignore E501 .
        
    - name: Run Backend Tests
      working-directory: ./backend
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://corphia:corphia123@localhost:5432/corphia_test
        SECRET_KEY: ci-test-secret-key
        APP_ENV: test
      run: |
        pytest tests/ --cov=app --cov-report=xml
        
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint Frontend (ESLint)
      working-directory: ./frontend
      run: npm run lint
        
    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm run test -- --run

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
